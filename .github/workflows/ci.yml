name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_MEMORY_LIMIT: "-1"

jobs:
  engine:
    name: engine (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('packages/shipping-engine/composer.lock', 'composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install engine dependencies
        working-directory: packages/shipping-engine
        run: composer install --no-interaction --prefer-dist

      - name: PHPUnit
        working-directory: packages/shipping-engine
        run: vendor/bin/phpunit

      - name: PHPStan
        working-directory: packages/shipping-engine
        run: vendor/bin/phpstan analyse

  module:
    name: module (PHP 8.3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('packages/shipping-engine/composer.lock', 'composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install engine dependencies
        working-directory: packages/shipping-engine
        run: composer install --no-interaction --prefer-dist

      - name: Install shop dependencies
        run: composer install --no-interaction --prefer-dist --no-plugins --no-scripts

      - name: PHPUnit
        run: packages/shipping-engine/vendor/bin/phpunit -c packages/shipping-module/phpunit.xml --testsuite Module

      - name: PHPStan
        run: packages/shipping-engine/vendor/bin/phpstan analyse -c packages/shipping-module/phpstan.neon
